name: Database security tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-security-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/database-security-tests.yml"

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.114.0

      - name: Start disposable local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local

      - name: Test Auth and tenant isolation
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f supabase/tests/rls_auth_tenant.sql

      - name: Test publication and penalty boundaries
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f supabase/tests/publication_security.sql

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
