name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Type-check and lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Reject committed Supabase secrets
        shell: bash
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^[:space:]]+' -- ':!package-lock.json'; then
            echo 'A Supabase secret or JWT-like credential may be committed.'
            exit 1
          fi
