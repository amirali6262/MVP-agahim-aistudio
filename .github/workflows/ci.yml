name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20.20.2
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Type-check and lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Reject committed credentials
        shell: bash
        run: |
          pattern='sb_secret_[A-Za-z0-9_-]+|sbp_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|SUPABASE_(SERVICE_ROLE_KEY|DB_PASSWORD)[[:space:]]*=[[:space:]]*[^[:space:]]+|postgres(ql)?://[^[:space:]@]+:[^[:space:]@]+@'
          if git grep -nE "$pattern" -- ':!package-lock.json'; then
            echo 'A secret, JWT-like credential, access token, database password, or credential-bearing database URL may be committed.'
            exit 1
          fi
